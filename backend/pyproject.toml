[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bharat-foodsafe-backend"
version = "0.1.0"
description = "Backend REST API Modular Monolith for Bharat FoodSafe"
readme = "../README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "scikit-learn==1.6.0",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "pyjwt==2.10.1",
    "boto3==1.35.84",
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "python-multipart==0.0.20"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
