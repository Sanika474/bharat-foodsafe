name: Bharat FoodSafe CI Pipeline

'on':
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foodsafety
          POSTGRES_PASSWORD: foodsafe_pass_2026
          POSTGRES_DB: bharat_foodsafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter & Formatter Check
        run: |
          cd backend
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://foodsafety:foodsafe_pass_2026@localhost:5432/bharat_foodsafe_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://foodsafety:foodsafe_pass_2026@localhost:5432/bharat_foodsafe_test
          JWT_SECRET: ci_test_jwt_secret_key_32_characters_minimum
        run: |
          cd backend
          pytest --cov=app tests/ --cov-fail-under=85

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck & Linting
        run: |
          cd frontend
          npm run typecheck
          npm run lint

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Build Production Frontend Assets
        run: |
          cd frontend
          npm run build
